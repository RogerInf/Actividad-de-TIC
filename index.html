<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Proyecto Login</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <!-- Contenedor principal de la página -->
    <main class="page">
        <section class="login-card" aria-labelledby="login-title">
            <!-- Marca del proyecto -->
            <div class="brand">
                <span class="brand-icon" aria-hidden="true">◆</span>
                <span>Conecta</span>
            </div>

            <!-- Presentación del formulario -->
            <div class="intro">
                <p class="eyebrow">BIENVENIDO DE NUEVO</p>
                <h1 id="login-title">Iniciar sesión</h1>
                <p class="subtitle">Ingresa tus datos para continuar.</p>
                <p style="color: var(--muted); font-size: 12px;">Ingresa tu correo y contraseña de demostración: demo@correo.com y demo12345</p>
            </div>

            <!-- Formulario de autenticación (demostración académica) -->
            <form id="login-form" novalidate>
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="nombre@correo.com"
                        autocomplete="email"
                        aria-describedby="email-error"
                        required
                    >
                    <small id="email-error" class="error-message" aria-live="polite"></small>
                </div>

                <div class="form-group">
                    <div class="label-row">
                        <label for="password">Contraseña</label>
                        <a href="#recuperacion" id="forgot-link">¿Olvidaste tu contraseña?</a>
                    </div>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Ingresa tu contraseña"
                            autocomplete="current-password"
                            aria-describedby="password-error"
                            required
                        >
                        <button type="button" id="toggle-password" aria-pressed="false">
                            Mostrar
                        </button>
                    </div>

                    <small id="password-error" class="error-message" aria-live="polite"></small>
                </div>

                <div class="form-options">
                    <label class="remember-option">
                        <input type="checkbox" id="remember">
                        Recordar mi correo
                    </label>
                </div>

                <button type="submit" class="submit-button">Iniciar sesión →</button>

                <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
            </form>

            <div class="security-note">
                Acceso de demostración para una práctica académica
            </div>
        </section>

        <footer class="page-footer">
            Proyecto académico · HTML, CSS y JavaScript
        </footer>
    </main>
</body>
</html>
